<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Умная Перекличка • NeuroLifeAI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f8f9fa);
            --text-color: var(--tg-theme-text-color, #212529);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #6c757d);
            --button-color: var(--tg-theme-button-color, #007bff);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --border-color: #e9ecef;
            --absent-color: #dc3545;
            --present-color: #198754;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            -webkit-user-select: none;
            user-select: none;
        }

        .nav-tabs {
            display: flex;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .tab-btn {
            flex: 1;
            padding: 8px 4px;
            border: none;
            background: transparent;
            color: var(--hint-color);
            font-weight: 600;
            font-size: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--button-color);
            color: var(--button-text);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card h2 { font-size: 15px; margin: 0 0 4px 0; font-weight: 700; }

        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label { font-size: 11px; color: var(--hint-color); text-transform: uppercase; font-weight: 600; }

        .control-select, .control-input, textarea {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
        }

        .controls-row { display: flex; gap: 10px; }

        .table-wrapper {
            background: var(--card-bg);
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            max-height: 50vh;
        }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: var(--card-bg); position: sticky; top: 0; font-size: 11px; color: var(--hint-color); white-space: nowrap; }

        .status-btn {
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            max-width: 80px;
        }

        .status-btn.present { background-color: #e6f4ea; color: var(--present-color); }
        .status-btn.absent { background-color: #fce8e6; color: var(--absent-color); }

        .main-btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background-color: var(--button-color);
            color: var(--button-text);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }

        .sec-btn { background: #e9ecef; color: #495057; }

        .summary-badge {
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .bg-success { background-color: #d1e7dd; color: #0f5132; }
        .bg-danger { background-color: #f8d7da; color: #842029; }
    </style>
</head>
<body>

    <!-- Вкладки навигации -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('journalTab', this)">📋 Перекличка</button>
        <button class="tab-btn" onclick="switchTab('reportTab', this)">📈 Отчет за период</button>
        <button class="tab-btn" onclick="switchTab('settingsTab', this)">⚙️ Группы</button>
    </div>

    <!-- Вкладка 1: Проведение переклички -->
    <div id="journalTab" class="tab-content active">
        <div class="card">
            <div class="control-group">
                <label>Дисциплина / Предмет</label>
                <select class="control-select" id="subjectSelect"></select>
            </div>

            <div class="controls-row">
                <div class="control-group" style="flex: 1;">
                    <label>Группа</label>
                    <select class="control-select" id="groupSelect" onchange="renderStudents()"></select>
                </div>
                <div class="control-group" style="flex: 1;">
                    <label>Дата</label>
                    <input type="date" class="control-input" id="datePicker">
                </div>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 5%;">№</th>
                        <th>ФИО Студента</th>
                        <th style="text-align: center; width: 30%;">Отметка</th>
                    </tr>
                </thead>
                <tbody id="studentList"></tbody>
            </table>
        </div>

        <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 8px;">
            <button class="main-btn" onclick="saveCurrentCheckin()">💾 Сохранить занятие и Скачать Excel</button>
        </div>
    </div>

    <!-- Вкладка 2: Отчет за период -->
    <div id="reportTab" class="tab-content">
        <div class="card">
            <h2>📊 Параметры отчета</h2>
            <div class="control-group">
                <label>Группа</label>
                <select class="control-select" id="reportGroupSelect" onchange="generateReport()"></select>
            </div>
            <div class="controls-row">
                <div class="control-group" style="flex: 1;">
                    <label>Дата начала</label>
                    <input type="date" class="control-input" id="reportStartDate" onchange="generateReport()">
                </div>
                <div class="control-group" style="flex: 1;">
                    <label>Дата конца</label>
                    <input type="date" class="control-input" id="reportEndDate" onchange="generateReport()">
                </div>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead id="reportTableHeader"></thead>
                <tbody id="reportTableBody"></tbody>
            </table>
        </div>

        <div style="margin-top: 14px;">
            <button class="main-btn" onclick="downloadPeriodReportExcel()">📥 Скачать Сводный Отчет (.xlsx)</button>
        </div>
    </div>

    <!-- Вкладка 3: Управление группами -->
    <div id="settingsTab" class="tab-content">
        <div class="card">
            <h2>➕ Добавить дисциплину</h2>
            <div class="controls-row">
                <input type="text" id="newSubjectInput" class="control-input" placeholder="Например: Нейросети в медиа">
                <button class="main-btn" style="width: auto; white-space: nowrap;" onclick="addSubject()">Добавить</button>
            </div>
        </div>

        <div class="card">
            <h2>👥 Управление студентами и группами</h2>
            <div class="control-group">
                <label>Название группы</label>
                <input type="text" id="targetGroupInput" class="control-input" placeholder="Например: ИТ-101">
            </div>

            <div class="control-group">
                <label>Единичное добавление ФИО</label>
                <div class="controls-row">
                    <input type="text" id="singleStudentInput" class="control-input" placeholder="Иванов Алексей">
                    <button class="main-btn sec-btn" style="width: auto; white-space: nowrap;" onclick="addSingleStudent()">+1</button>
                </div>
            </div>

            <div class="control-group">
                <label>Групповой ввод (списком из Excel/файла)</label>
                <textarea id="bulkStudentInput" rows="4" placeholder="Вставьте список фамилий (каждый студент с новой строки)..."></textarea>
            </div>

            <button class="main-btn" onclick="addBulkStudents()">💾 Сохранить список студентов</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Авто-установка дат (по умолчанию текущий месяц)
        const now = new Date();
        document.getElementById('datePicker').valueAsDate = now;

        const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
        document.getElementById('reportStartDate').valueAsDate = firstDay;
        document.getElementById('reportEndDate').valueAsDate = now;

        // База данных
        let db = JSON.parse(localStorage.getItem('neuroJournalDB')) || {
            subjects: ["Искусственный Интеллект в Образовании", "Цифровые Технологии"],
            groups: {
                "ИТ-101": ["Абдуллаева Амина", "Асанбеков Бакыт", "Болотбекова Айпери"],
                "ПИ-202": ["Иванов Дмитрий", "Исмаилов Нурбек", "Кузнецова София"]
            },
            history: [] // История перекличек: [{group, subject, date, records: {name: 'Был'/'Н/Я'}}]
        };

        function saveData() {
            localStorage.setItem('neuroJournalDB', JSON.stringify(db));
            initDropdowns();
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');

            if (tabId === 'reportTab') {
                generateReport();
            }
        }

        function initDropdowns() {
            const subjSelect = document.getElementById('subjectSelect');
            subjSelect.innerHTML = db.subjects.map(s => `<option>${s}</option>`).join('');

            const groupSelect = document.getElementById('groupSelect');
            const reportGroupSelect = document.getElementById('reportGroupSelect');
            const groupNames = Object.keys(db.groups);
            
            const groupOptions = groupNames.map(g => `<option>${g}</option>`).join('');
            groupSelect.innerHTML = groupOptions;
            reportGroupSelect.innerHTML = groupOptions;

            renderStudents();
        }

        function renderStudents() {
            const group = document.getElementById('groupSelect').value;
            const students = db.groups[group] || [];
            const tbody = document.getElementById('studentList');

            if (students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color: var(--hint-color);">В этой группе пока нет студентов</td></tr>`;
                return;
            }

            tbody.innerHTML = students.map((name, idx) => `
                <tr>
                    <td style="color: var(--hint-color); font-size: 12px;">${idx + 1}</td>
                    <td class="student-name" style="font-weight: 500;">${name}</td>
                    <td style="text-align: center;">
                        <button class="status-btn present" onclick="toggleStatus(this)">Был</button>
                    </td>
                </tr>
            `).join('');
        }

        function toggleStatus(btn) {
            if (btn.classList.contains('present')) {
                btn.classList.remove('present');
                btn.classList.add('absent');
                btn.innerText = 'Н/Я';
            } else {
                btn.classList.remove('absent');
                btn.classList.add('present');
                btn.innerText = 'Был';
            }
        }

        // Сохранение переклички и генерация единичного отчета
        function saveCurrentCheckin() {
            const subject = document.getElementById('subjectSelect').value;
            const group = document.getElementById('groupSelect').value;
            const date = document.getElementById('datePicker').value;

            const trs = document.querySelectorAll('#studentList tr');
            const records = {};
            const attendanceList = [];

            trs.forEach((tr, idx) => {
                const nameEl = tr.querySelector('.student-name');
                const btnEl = tr.querySelector('.status-btn');
                if (nameEl && btnEl) {
                    const name = nameEl.innerText;
                    const status = btnEl.innerText;
                    records[name] = status;
                    attendanceList.push({ num: idx + 1, name: name, status: status });
                }
            });

            // Записываем в историю
            if (!db.history) db.history = [];
            
            // Удаляем старую запись за эту дату/группу, если перекличка перезаписывается
            db.history = db.history.filter(h => !(h.group === group && h.date === date && h.subject === subject));
            db.history.push({ group, subject, date, records });
            saveData();

            const dataToSend = {
                subject: subject,
                group: group,
                date: date,
                students: attendanceList
            };

            if (tg && tg.sendData) {
                try {
                    tg.sendData(JSON.stringify(dataToSend));
                    return;
                } catch(e) {}
            }

            generateExcelLocally(subject, group, date, attendanceList);
        }

        // Генерация отчета за период
        function generateReport() {
            const group = document.getElementById('reportGroupSelect').value;
            const start = document.getElementById('reportStartDate').value;
            const end = document.getElementById('reportEndDate').value;

            const students = db.groups[group] || [];
            
            // Находим все проведенные переклички для группы за период
            const filteredHistory = (db.history || []).filter(h => {
                return h.group === group && h.date >= start && h.date <= end;
            }).sort((a, b) => a.date.localeCompare(b.date));

            const headerRow = document.getElementById('reportTableHeader');
            const tbody = document.getElementById('reportTableBody');

            if (students.length === 0) {
                headerRow.innerHTML = '';
                tbody.innerHTML = '<tr><td style="text-align:center;">В этой группе нет студентов</td></tr>';
                return;
            }

            // Формируем заголовок таблицы: № | ФИО | [Даты] | Посещаемость (%)
            let headerHTML = `<tr><th style="width:5%;">№</th><th>ФИО Студента</th>`;
            filteredHistory.forEach(h => {
                const shortDate = h.date.split('-').slice(1).join('.');
                headerHTML += `<th style="text-align:center;">${shortDate}</th>`;
            });
            headerHTML += `<th style="text-align:center;">Был</th><th style="text-align:center;">Н/Я</th><th style="text-align:center;">%</th></tr>`;
            headerRow.innerHTML = headerHTML;

            // Формируем строки по каждому студенту
            let bodyHTML = '';
            students.forEach((student, idx) => {
                let presentCount = 0;
                let absentCount = 0;

                let rowHTML = `<tr><td style="color:var(--hint-color);">${idx + 1}</td><td style="font-weight:500;">${student}</td>`;

                filteredHistory.forEach(h => {
                    const status = (h.records && h.records[student]) ? h.records[student] : '-';
                    if (status === 'Был') {
                        presentCount++;
                        rowHTML += `<td style="text-align:center; color:var(--present-color); font-weight:600;">+</td>`;
                    } else if (status === 'Н/Я') {
                        absentCount++;
                        rowHTML += `<td style="text-align:center; color:var(--absent-color); font-weight:600;">Н/Я</td>`;
                    } else {
                        rowHTML += `<td style="text-align:center; color:var(--hint-color);">-</td>`;
                    }
                });

                const totalClasses = presentCount + absentCount;
                const percent = totalClasses > 0 ? Math.round((presentCount / totalClasses) * 100) : 0;
                const badgeClass = percent >= 75 ? 'bg-success' : 'bg-danger';

                rowHTML += `<td style="text-align:center;">${presentCount}</td>`;
                rowHTML += `<td style="text-align:center;">${absentCount}</td>`;
                rowHTML += `<td style="text-align:center;"><span class="summary-badge ${badgeClass}">${percent}%</span></td></tr>`;

                bodyHTML += rowHTML;
            });

            tbody.innerHTML = bodyHTML;
        }

        // Скачивание сводного Excel за период
        function downloadPeriodReportExcel() {
            const group = document.getElementById('reportGroupSelect').value;
            const start = document.getElementById('reportStartDate').value;
            const end = document.getElementById('reportEndDate').value;

            const students = db.groups[group] || [];
            const filteredHistory = (db.history || []).filter(h => {
                return h.group === group && h.date >= start && h.date <= end;
            }).sort((a, b) => a.date.localeCompare(b.date));

            const rows = [
                [`СВОДНЫЙ ОТЧЕТ ПОСЕЩАЕМОСТИ`],
                [`Группа: ${group}`],
                [`Период: с ${start} по ${end}`],
                []
            ];

            // Заголовок Excel
            const headerRow = ["№", "ФИО Студента"];
            filteredHistory.forEach(h => headerRow.push(h.date));
            headerRow.push("Всего Был", "Всего Н/Я", "% Посещаемости");
            rows.push(headerRow);

            // Данные по студентам
            students.forEach((student, idx) => {
                let presentCount = 0;
                let absentCount = 0;
                const studentRow = [idx + 1, student];

                filteredHistory.forEach(h => {
                    const status = (h.records && h.records[student]) ? h.records[student] : '-';
                    if (status === 'Был') {
                        presentCount++;
                        studentRow.push("Был");
                    } else if (status === 'Н/Я') {
                        absentCount++;
                        studentRow.push("Н/Я");
                    } else {
                        studentRow.push("-");
                    }
                });

                const totalClasses = presentCount + absentCount;
                const percent = totalClasses > 0 ? `${Math.round((presentCount / totalClasses) * 100)}%` : '0%';

                studentRow.push(presentCount, absentCount, percent);
                rows.push(studentRow);
            });

            const worksheet = XLSX.utils.aoa_to_sheet(rows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Отчет за период");

            const fileName = `Сводный_Отчет_${group}_${start}_${end}.xlsx`;
            XLSX.writeFile(workbook, fileName);
        }

        function generateExcelLocally(subject, group, date, students) {
            const rows = [
                ["ВЕДОМОСТЬ ПОСЕЩАЕМОСТИ"],
                ["Дисциплина:", subject],
                ["Группа:", group],
                ["Дата занятия:", date],
                [],
                ["№", "ФИО Студента", "Статус"]
            ];

            let present = 0, absent = 0;
            students.forEach(s => {
                rows.push([s.num, s.name, s.status]);
                if (s.status === 'Был') present++; else absent++;
            });

            rows.push([]);
            rows.push(["Итого присутствовало:", present]);
            rows.push(["Итого отсутствовало:", absent]);

            const worksheet = XLSX.utils.aoa_to_sheet(rows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Ведомость");

            const fileName = `Ведомость_${group}_${date}.xlsx`;
            XLSX.writeFile(workbook, fileName);
        }

        function addSubject() {
            const val = document.getElementById('newSubjectInput').value.trim();
            if (!val) return;
            if (!db.subjects.includes(val)) {
                db.subjects.push(val);
                saveData();
                document.getElementById('newSubjectInput').value = '';
                if (tg && tg.showAlert) tg.showAlert(`✅ Дисциплина "${val}" добавлена!`); else alert(`✅ Дисциплина "${val}" добавлена!`);
            }
        }

        function addSingleStudent() {
            const group = document.getElementById('targetGroupInput').value.trim();
            const student = document.getElementById('singleStudentInput').value.trim();
            if (!group || !student) {
                const msg = '⚠️ Укажите группу и ФИО';
                if (tg && tg.showAlert) tg.showAlert(msg); else alert(msg);
                return;
            }

            if (!db.groups[group]) db.groups[group] = [];
            db.groups[group].push(student);
            saveData();
            document.getElementById('singleStudentInput').value = '';
            const msg = `✅ ${student} добавлен в группу ${group}`;
            if (tg && tg.showAlert) tg.showAlert(msg); else alert(msg);
        }

        function addBulkStudents() {
            const group = document.getElementById('targetGroupInput').value.trim();
            const rawText = document.getElementById('bulkStudentInput').value.trim();
            if (!group || !rawText) {
                const msg = '⚠️ Укажите группу и вставьте список';
                if (tg && tg.showAlert) tg.showAlert(msg); else alert(msg);
                return;
            }

            const newStudents = rawText.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            if (!db.groups[group]) db.groups[group] = [];

            db.groups[group] = [...db.groups[group], ...newStudents];
            saveData();
            document.getElementById('bulkStudentInput').value = '';
            const msg = `✅ Добавлено ${newStudents.length} студентов в группу ${group}`;
            if (tg && tg.showAlert) tg.showAlert(msg); else alert(msg);
        }

        initDropdowns();
    </script>
</body>
</html>
